ktor {
    deployment {
        port = 3040
        port = ${?BILLING_PORT}
        host = "0.0.0.0"
    }
    application {
        modules = [com.apollodeploy.billing.BillingApplicationKt.module]
    }
}

apollo-billing {
    port = 3040
    port = ${?BILLING_PORT}
    environment = "development"
    environment = ${?APP_ENV}
    environment = ${?APOLLO_BILLING_ENV}
    db-provider = "postgres"
    db-provider = ${?DB_PROVIDER}
    request-body-limit-bytes = 10485760
    request-body-limit-bytes = ${?REQUEST_BODY_LIMIT_BYTES}
    metrics-enabled = false
    metrics-enabled = ${?METRICS_ENABLED}
    cors-origins = ""
    cors-origins = ${?CORS_ORIGINS}

    polar {
        webhook-secret = ""
        webhook-secret = ${?POLAR_WEBHOOK_SECRET}
        api-key = ""
        api-key = ${?POLAR_API_KEY}
        api-base-url = "https://api.polar.sh"
        api-base-url = ${?POLAR_API_BASE_URL}
        request-timeout-ms = 10000
        request-timeout-ms = ${?POLAR_REQUEST_TIMEOUT_MS}
    }

    # Read/write pool — billing_app role.
    # CRUD on billing_customers, billing_subscriptions + SELECT on platform_apps.
    platform-db {
        host = "localhost"
        host = ${?PLATFORM_DB_HOST}
        port = 5432
        port = ${?PLATFORM_DB_PORT}
        name = "apollo_deploy_platform"
        name = ${?PLATFORM_DB_NAME}
        user = "billing_app"
        user = ${?PLATFORM_DB_USER}
        password = ""
        password = ${?PLATFORM_DB_PASSWORD}
        sslmode = "disable"
        sslmode = ${?PLATFORM_DB_SSLMODE}
        pool-max-size = 10
        pool-max-size = ${?PLATFORM_DB_POOL_MAX_SIZE}
        idle-timeout-ms = 10000
        idle-timeout-ms = ${?PLATFORM_DB_IDLE_TIMEOUT_MS}
        connection-timeout-ms = 3000
        connection-timeout-ms = ${?PLATFORM_DB_CONNECTION_TIMEOUT_MS}
        statement-timeout-ms = 30000
        statement-timeout-ms = ${?PLATFORM_DB_STATEMENT_TIMEOUT_MS}
    }

    # Read-only pool — billing_superuser role, platform database.
    # SELECT on apikey. Shares host/port/name with platform-db; different role.
    platform-reader-db {
        host = "localhost"
        host = ${?PLATFORM_DB_HOST}
        port = 5432
        port = ${?PLATFORM_DB_PORT}
        name = "apollo_deploy_platform"
        name = ${?PLATFORM_DB_NAME}
        user = "billing_superuser"
        user = ${?BILLING_SUPERUSER_USER}
        password = ""
        password = ${?BILLING_SUPERUSER_PASSWORD}
        pool-max-size = 5
        pool-max-size = ${?PLATFORM_READER_DB_POOL_MAX_SIZE}
        idle-timeout-ms = 10000
        idle-timeout-ms = ${?PLATFORM_READER_DB_IDLE_TIMEOUT_MS}
        connection-timeout-ms = 3000
        connection-timeout-ms = ${?PLATFORM_READER_DB_CONNECTION_TIMEOUT_MS}
        statement-timeout-ms = 30000
        statement-timeout-ms = ${?PLATFORM_READER_DB_STATEMENT_TIMEOUT_MS}
    }

    # Platform OAuth2 — used for client_credentials token (audit-log ingestion, /internal/* calls).
    platform {
        url = ""
        url = ${?PLATFORM_URL}
        client-id = ""
        client-id = ${?PLATFORM_CLIENT_ID}
        client-secret = ""
        client-secret = ${?PLATFORM_CLIENT_SECRET}
    }

    # IAM / OAuth M2M inbound verification — guards /internal/* endpoints.
    #
    # Callers (e.g. apollo-signal-api) obtain a client_credentials JWT from the
    # platform (`POST {platform.url}/auth/oauth2/token`) and send it as
    # `Authorization: Bearer <token>`. Billing fetches the platform's EdDSA
    # public JWKS to verify tokens locally (no shared secret needed).
    #
    # auth-jwks-url       — where to fetch the public JWKS (default: {platform.url}/auth/jwks)
    # issuer-url          — expected `iss` claim (default: platform.url)
    # valid-audiences     — expected `aud` claim(s), comma-separated (default: platform.url)
    # service-client-ids  — comma-separated list of OAuth client_ids allowed to call
    #                       /internal/* — MUST include every first-party service that
    #                       calls billing (e.g. signal's client_id). Fails closed when empty.
    iam {
        auth-jwks-url = ""
        auth-jwks-url = ${?AUTH_JWKS_URL}
        issuer-url = ""
        issuer-url = ${?AUTH_OAUTH_ISSUER_URL}
        valid-audiences = ""
        valid-audiences = ${?AUTH_OAUTH_VALID_AUDIENCES}
        service-client-ids = ""
        service-client-ids = ${?OAUTH_SERVICE_CLIENT_IDS}
        request-timeout-ms = 5000
        request-timeout-ms = ${?IAM_REQUEST_TIMEOUT_MS}
    }

    # Read-only pool — billing_superuser role, signal database.
    # SELECT on projects, domains, webhook_endpoints, organization_usage_daily.
    signal-db {
        host = "localhost"
        host = ${?SIGNAL_DB_HOST}
        port = 5432
        port = ${?SIGNAL_DB_PORT}
        name = "apollo_deploy_signal"
        name = ${?SIGNAL_DB_NAME}
        user = "billing_superuser"
        user = ${?BILLING_SUPERUSER_USER}
        password = ""
        password = ${?BILLING_SUPERUSER_PASSWORD}
        sslmode = "disable"
        sslmode = ${?SIGNAL_DB_SSLMODE}
        pool-max-size = 5
        pool-max-size = ${?SIGNAL_DB_POOL_MAX_SIZE}
        idle-timeout-ms = 10000
        idle-timeout-ms = ${?SIGNAL_DB_IDLE_TIMEOUT_MS}
        connection-timeout-ms = 3000
        connection-timeout-ms = ${?SIGNAL_DB_CONNECTION_TIMEOUT_MS}
        statement-timeout-ms = 30000
        statement-timeout-ms = ${?SIGNAL_DB_STATEMENT_TIMEOUT_MS}
    }

    signal {
        email-received-meter-id = ""
        email-received-meter-id = ${?SIGNAL_EMAIL_RECEIVED_METER_ID}
    }

    # Redis — provided by the platform stack.
    # Used for: Polar state fallback cache, usage idempotency, webhook dedup.
    redis {
        host = "localhost"
        host = ${?REDIS_HOST}
        port = 6379
        port = ${?REDIS_PORT}
        password = ""
        password = ${?REDIS_PASSWORD}
        db = 0
        db = ${?REDIS_DB}
    }

}
