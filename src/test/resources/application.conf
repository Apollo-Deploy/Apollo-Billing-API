
apollo-billing {
    port = 3040
    environment = "test"

    polar {
        webhook-secret = "test-webhook-secret"
        api-key = "test-api-key"
        api-base-url = "https://api.polar.sh"
        request-timeout-ms = 10000
    }

    platform-db {
        host = "localhost"
        port = 5432
        name = "apollo_deploy_platform"
        user = "billing_app"
        password = "test"
        pool-max-size = 10
        idle-timeout-ms = 10000
        connection-timeout-ms = 3000
        statement-timeout-ms = 30000
    }

    platform-reader-db {
        host = "localhost"
        port = 5432
        name = "apollo_deploy_platform"
        user = "billing_superuser"
        password = "test"
        pool-max-size = 5
        idle-timeout-ms = 10000
        connection-timeout-ms = 3000
        statement-timeout-ms = 30000
    }

    signal-db {
        host = "localhost"
        port = 5432
        name = "apollo_deploy_signal"
        user = "billing_superuser"
        password = "test"
        pool-max-size = 5
        idle-timeout-ms = 10000
        connection-timeout-ms = 3000
        statement-timeout-ms = 30000
    }

    platform {
        url = "http://localhost:4000"
        client-id = "test-client-id"
        client-secret = "test-client-secret"
    }

    iam {
        jwks-url = ""
        issuer-url = ""
        valid-audiences = ""
        service-client-ids = ""
        request-timeout-ms = 5000
    }

    redis {
        host = "localhost"
        port = 6379
        password = ""
    }
}
