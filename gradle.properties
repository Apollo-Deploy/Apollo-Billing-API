kotlin.code.style=official
# Local Docker runs Gradle and the service in the same container. Keep the
# build JVM bounded and compile Kotlin in-process so an idle compiler daemon
# does not hold another large heap for hours after startup.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=768m
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.compiler.execution.strategy=in-process
