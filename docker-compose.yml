# ─────────────────────────────────────────────────────────────────────────────
# Apollo Billing (production-ready)
#
# Billing does NOT own a Postgres, Redis, or nginx instance. All three are
# provided by the platform stack. The billing service joins the shared
# `apollo` network to reach them by container name.
#
# Start:   docker compose up -d
# Build:   docker compose build
# Logs:    docker compose logs -f billing
# ─────────────────────────────────────────────────────────────────────────────

services:

  billing:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GRADLE_VERBOSE: ${GRADLE_VERBOSE:-0}
        BUILD_VERSION: ${BUILD_VERSION:-1.0.0}
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: apollo-billing:${IMAGE_TAG:-latest}
    container_name: apollo-billing
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      BILLING_PORT: "3040"
    ports:
      - "3040:3040"
    networks:
      apollo:
        external: true
        name: apollo
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3040/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    read_only: true
    tmpfs:
      - /tmp:size=100M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
          pids: 256
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  apollo:
    external: true
    name: apollo
