name: Release

# Triggered only on version tags (v1.2.3 or 1.2.3).
# Builds the fat JAR, creates a GitHub Release, attaches the JAR as an asset,
# then builds and pushes the Docker image to GHCR with the full semver tags.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write   # create releases + upload assets
  packages: write   # push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1. Build fat JAR ────────────────────────────────────────────────────────
  build-jar:
    name: Build fat JAR
    runs-on: ubuntu-latest
    outputs:
      jar-name: ${{ steps.jar-name.outputs.name }}
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Strip leading 'v' if present
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shadow JAR
        run: ./gradlew shadowJar --no-daemon -x test --stacktrace

      - name: Locate & rename JAR
        id: jar-name
        run: |
          SRC=$(ls build/libs/apollo-billing-*.jar | head -1)
          DEST="apollo-billing-${{ steps.version.outputs.value }}.jar"
          cp "$SRC" "$DEST"
          echo "name=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: ${{ steps.jar-name.outputs.name }}
          retention-days: 1

  # ── 2. Create GitHub Release + attach JAR ───────────────────────────────────
  github-release:
    name: GitHub Release
    needs: build-jar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for tag message / full history

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: jar

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.build-jar.outputs.version }}
          generate_release_notes: true
          files: ${{ needs.build-jar.outputs.jar-name }}

  # ── 3. Build & push Docker image ────────────────────────────────────────────
  docker:
    name: Docker image
    needs: build-jar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
