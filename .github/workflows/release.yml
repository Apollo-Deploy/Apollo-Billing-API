name: Release

# Triggered only on version tags (v1.2.3 or 1.2.3).
# Builds the fat JAR, creates a GitHub Release, and attaches the JAR as an asset.
# Container publication is intentionally exclusive to docker-publish.yml so a
# tag workflow cannot bypass the governed signature and provenance policy.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  # ── 1. Build fat JAR ────────────────────────────────────────────────────────
  build-jar:
    name: Build fat JAR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      jar-name: ${{ steps.jar-name.outputs.name }}
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Strip leading 'v' if present
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build shadow JAR
        run: ./gradlew shadowJar --no-daemon -x test --stacktrace

      - name: Locate & rename JAR
        id: jar-name
        run: |
          SRC=$(ls build/libs/apollo-billing-*.jar | head -1)
          DEST="apollo-billing-${{ steps.version.outputs.value }}.jar"
          cp "$SRC" "$DEST"
          echo "name=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jar
          path: ${{ steps.jar-name.outputs.name }}
          retention-days: 1

  # ── 2. Create GitHub Release + attach JAR ───────────────────────────────────
  github-release:
    name: GitHub Release
    needs: build-jar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # needed for tag message / full history
          persist-credentials: false

      - name: Download JAR artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jar

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ needs.build-jar.outputs.version }}
          generate_release_notes: true
          files: ${{ needs.build-jar.outputs.jar-name }}
