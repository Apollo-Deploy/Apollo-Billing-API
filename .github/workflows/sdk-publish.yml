name: Publish SDKs

# Generate and publish the TypeScript and JVM billing SDKs when an SDK release
# tag is pushed, e.g. `sdk-v1.0.8`. The tag suffix becomes SDK_VERSION.
#
# The SDK generator first exports Billing's OpenAPI 3.1 contract in offline mode.
# The export assembly uses stub database pools and does not connect to Postgres,
# Redis, Polar, or the Platform OAuth service.
on:
  push:
    tags: ["sdk-v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version to publish (e.g. 1.0.8)"
        required: true
        type: string
      targets:
        description: "Packages to publish"
        required: true
        default: "kotlin"
        type: choice
        options:
          - kotlin
          - typescript,kotlin
          - typescript

concurrency:
  group: sdk-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Generate & publish
    runs-on: ubuntu-latest

    env:
      # SDK coordinates; both TypeScript and JVM SDKs are always generated.
      # Offline OpenAPI export consumed by scripts/generate-sdk.sh → ./gradlew run.
      APOLLO_BILLING_ENV: development
      TESSERACT_PUBLISH_TARGETS: ${{ inputs.targets || 'typescript,kotlin' }}
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
      SERVICE_AUTH_SECRET: ci-build-secret
      POLAR_WEBHOOK_SECRET: ci-build-secret
      # Publishing credentials (configure as repository secrets).
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve SDK version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            # Strip the "sdk-v" prefix from the tag (refs/tags/sdk-v1.0.8 -> 1.0.8).
            version="${GITHUB_REF_NAME#sdk-v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing SDK version $version"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install Tesseract SDK generator
        run: npm install --global @apollo-deploy/tesseract@3.1.0

      - name: Generate & publish SDKs
        run: TESSERACT_PUBLISH=1 TESSERACT_PACKAGE_VERSION="${{ steps.version.outputs.version }}" scripts/generate-sdk.sh
